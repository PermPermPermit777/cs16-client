name: bump yapb update

on:
   workflow_dispatch:
   schedule:
     - cron: "17 3 */5 * *"

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: true
      - run: git submodule update --remote --recursive 3rdparty/yapb
      - uses: planetscale/ghcommit-action@main
        if: success()
        with:
          commit_message: "chore: Bump Yapb to latest commit"
          repo: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          
