name: bump Yapb to latest commit

on:
   workflow_dispatch:
   schedule:
     - cron: "17 3 */5 * *"

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: true
      - run: git submodule update --init --remote --recursive 3rdparty/yapb
      - uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: Bump Yapb to latest commit
